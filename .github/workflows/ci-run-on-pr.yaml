name: Build images on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    # build on a runner of the target arch (native arm64 runners are free for public repos), no QEMU
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: build wal-g-pg
        uses: docker/build-push-action@v7
        with:
          context: images/wal-g-pg
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: wal-g-pg:test

      - name: check wal-g-pg
        run: |
          docker run --rm wal-g-pg:test --version
          USER=$(docker image inspect wal-g-pg:test --format '{{.Config.User}}')
          echo "Runs as user ${USER}"
          [ "${USER}" = 65532 ]

  check-build-status:
    runs-on: ubuntu-latest
    needs:
      - build
    if: always()
    steps:
      - name: Evaluate build status
        run: |
          echo "Build images result: ${{ needs.build.result }}"

          for RESULT in ${{ join(needs.*.result, ' ') }}; do
            case "$RESULT" in
              success | skipped) ;;
              failure) exit 1 ;;
              *) echo "Tests were cancelled."; exit 1 ;;
            esac
          done
